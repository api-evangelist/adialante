aid: adialante
name: Adialante
description: >-
  Adialante is a medical imaging startup redesigning MRI from the ground up with
  new physics, algorithms, and hardware to make cancer screening accessible and
  affordable. Rather than selling multi-million-dollar equipment, Adialante
  deploys compact, mobile, diagnostic-grade MRI units to clinics on a flat
  per-scan fee, letting clinics collect insurance reimbursement and keep the
  margin. Its full-body scanner is roughly 80% lighter and uses about 60% less
  power than a traditional MRI. The company is starting with pre-biopsy prostate
  imaging for urology practices, with breast, orthopedic, brain, and whole-body
  screening on the roadmap. Founded in 2023 and part of Y Combinator's Spring
  2026 batch, Adialante is backed by more than $3M in grants including NSF SBIR
  Phase II funding.
